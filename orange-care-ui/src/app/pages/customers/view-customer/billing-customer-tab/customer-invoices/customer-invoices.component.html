<mat-card class="mt-1 p-0">
    <mat-card-header>
        <mat-card-title>Invoices</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-divider></mat-divider>
        <table mat-table [dataSource]="dataSource">
            <!-- Checkbox Column -->
            <ng-container matColumnDef="#">
                <th mat-header-cell *matHeaderCellDef width="7%">
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                                  [checked]="selection.hasValue() && isAllSelected()"
                                  [indeterminate]="selection.hasValue() && !isAllSelected()"
                                  [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()"
                                  (change)="$event ? selection.toggle(row) : null"
                                  [checked]="selection.isSelected(row)"
                                  [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="invoice">
                <th mat-header-cell *matHeaderCellDef height="30px" width="10%"> Invoice No </th>
                <td mat-cell *matCellDef="let element"> 2402000416 </td>
            </ng-container>
            <ng-container matColumnDef="invoiceDate">
                <th mat-header-cell *matHeaderCellDef width="10%"> Invoice Date </th>
                <td mat-cell *matCellDef="let element"> May 1, 2024 </td>
            </ng-container>
            <ng-container matColumnDef="invoiceAmount">
                <th mat-header-cell *matHeaderCellDef width="10%"> Invoice Amount </th>
                <td mat-cell *matCellDef="let element"> 1000 TND </td>
            </ng-container>
            <ng-container matColumnDef="openAmount">
                <th mat-header-cell *matHeaderCellDef width="10%"> Open Amount </th>
                <td mat-cell *matCellDef="let element"> 1000 TND </td>
            </ng-container>
            <ng-container matColumnDef="billingAccount">
                <th mat-header-cell *matHeaderCellDef width="15%"> Billing Account </th>
                <td mat-cell *matCellDef="let element"> BA0020596922 </td>
            </ng-container>
            <ng-container matColumnDef="dueDate">
                <th mat-header-cell *matHeaderCellDef width="10%"> Due Date </th>
                <td mat-cell *matCellDef="let element">
                    <span>May 1, 2024</span>
                </td>
            </ng-container>
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef width="10%"> Status </th>
                <td mat-cell *matCellDef="let element">
                    <mat-chip-list>
              <span>
                <mat-chip [class.gradient-green]="0==0">Paid</mat-chip>
              </span>
                    </mat-chip-list>
                </td>
            </ng-container>
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef width="10%">Action</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button
                            color="primary"
                            matTooltip="edit">
                        <mat-icon class="icon24">visibility</mat-icon>
                    </button>&nbsp;
                    <button mat-icon-button
                            color="warn"
                            matTooltip="delete">
                        <mat-icon class="icon24">delete</mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </mat-card-content>
</mat-card>
