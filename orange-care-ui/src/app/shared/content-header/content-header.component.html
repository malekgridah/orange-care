<div class="div-border content-header bg-primary" [class.bg-image]="!hasBgImage" [ngClass]="class">
  
  <app-breadcrumb [hidden]="hideBreadcrumb"></app-breadcrumb>
  <mat-icon *ngIf="icon" class="mat-icon-lg">{{icon}}</mat-icon>
    <h2 *ngIf="title">
        <strong>{{title}}</strong>
    </h2>
  <h3 *ngIf="desc" class="p-2">{{desc}}</h3>
</div>
