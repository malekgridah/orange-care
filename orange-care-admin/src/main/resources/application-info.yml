info: # Application-Info for the Info-Actuator
  group: "@pom.groupId@"
  artifact: "@pom.artifactId@"
  description: "@pom.description@"
  version: "@pom.version@"
  spring-boot: "@spring-boot.version@"
  spring-cloud: "@spring-cloud.version@"
  # Tags for the Spring Boot Admin UI
  tags:
    version: "@pom.version@"
    spring-boot: "@spring-boot.version@"
    spring-cloud: "@spring-cloud.version@"


module: "${AnsiColor.MAGENTA} :: ${AnsiStyle.BOLD}${pom.basedir.artifactId} ::${AnsiColor.CYAN}"
title1: "${AnsiColor.BLUE}${AnsiStyle.BOLD}    App Info    ${AnsiStyle.NORMAL}${AnsiColor.CYAN}"
txt1: "${AnsiColor.YELLOW}Project:${AnsiStyle.NORMAL} ${spring.application.name}${AnsiColor.CYAN}"
txt2: "${AnsiColor.YELLOW}Version:${AnsiStyle.NORMAL} ${info.version}${AnsiColor.CYAN}"
txt3: "${AnsiColor.YELLOW}Description:${AnsiStyle.NORMAL} ${info.description}${AnsiColor.CYAN}"
